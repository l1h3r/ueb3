[package]
name = "ueb3"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
readme = "README.md"

[workspace]
members = [
  "crates/ueb3-api",
  "crates/ueb3-rpc",
  "crates/ueb3-serde",
  "crates/ueb3-types",
  "crates/ueb3-ureq",
  "crates/ueb3-utils",
]
exclude = [
  "examples",
]

[dependencies]
ueb3-api = { version = "=0.1", path = "crates/ueb3-api" }
ueb3-rpc = { version = "=0.1", path = "crates/ueb3-rpc" }
ueb3-serde = { version = "=0.1", path = "crates/ueb3-serde" }
ueb3-types = { version = "=0.1", path = "crates/ueb3-types" }
ueb3-utils = { version = "=0.1", path = "crates/ueb3-utils" }

ueb3-ureq = { version = "=0.1", path = "crates/ueb3-ureq", optional = true }

[workspace.dependencies]
const-hex = { version = "1.14", default-features = false }
itoa = { version = "1.0", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0", default-features = false, features = ["arbitrary_precision", "raw_value", "std"] }
tiny-keccak = { version = "2.0", default-features = false, features = ["keccak"] }
uint = { version = "0.10", default-features = false, features = ["std"] }

[features]
default = ["streams", "sled", "ureq"]
streams = ["ueb3-api/streams"]

ureq = ["dep:ueb3-ureq"]

# ------------------------------------------------------------------------------
# Rustc Lints
# https://doc.rust-lang.org/rustc/lints/index.html
# ------------------------------------------------------------------------------

[workspace.lints.rust]
# Lint Groups
warnings = { level = "deny", priority = -1 }
deprecated-safe = { level = "deny", priority = -1 }
future-incompatible = { level = "deny", priority = -1 }
keyword-idents = { level = "deny", priority = -1 }
let-underscore = { level = "deny", priority = -1 }
nonstandard-style = { level = "deny", priority = -1 }
refining-impl-trait = { level = "deny", priority = -1 }
rust-2018-compatibility = { level = "deny", priority = -1 }
rust-2018-idioms = { level = "deny", priority = -1 }
rust-2021-compatibility = { level = "deny", priority = -1 }
rust-2024-compatibility = { level = "deny", priority = -1 }
unused = { level = "deny", priority = -1 }

# Standalone Lints
ambiguous_negative_literals = "deny"
ffi_unwind_calls = "deny"
macro_use_extern_crate = "deny"
meta_variable_misuse = "deny"
missing_abi = "deny"
missing_copy_implementations = "deny"
missing_debug_implementations = "deny"
missing_docs = "deny"
non_ascii_idents = "deny"
redundant_imports = "deny"
redundant_lifetimes = "deny"
single_use_lifetimes = "allow" # allow because noisy
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unit_bindings = "deny"
unnameable_types = "allow" # allow because we use sealed traits
unreachable_pub = "deny"
unsafe_code = "allow" # allow because we use unsafe APIs
unstable_features = "deny"
unused_crate_dependencies = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_qualifications = "deny"
unused_results = "deny"
variant_size_differences = "deny"

# ------------------------------------------------------------------------------
# Clippy Lints
# https://doc.rust-lang.org/clippy
# ------------------------------------------------------------------------------

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
restriction = { level = "allow", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "allow", priority = -1 }

# pedantic noise
into_iter_without_iter = "allow"
match_same_arms = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
transmute_ptr_to_ptr = "allow"

# ------------------------------------------------------------------------------
# Rustdoc Lints
# https://doc.rust-lang.org/rustdoc/lints.html
# ------------------------------------------------------------------------------

[workspace.lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"
invalid_codeblock_attributes = "deny"
invalid_html_tags = "deny"
invalid_rust_codeblocks = "deny"
missing_crate_level_docs = "deny"
# missing_doc_code_examples = "deny" # unstable
private_doc_tests = "deny"
private_intra_doc_links = "deny"
redundant_explicit_links = "deny"
unescaped_backticks = "deny"
